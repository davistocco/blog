<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 350" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d2a2"/>
      <stop offset="1" stop-color="#e9a77b"/>
    </linearGradient>
    <g id="gear">
      <circle r="1" fill="#1f2c44"/>
      <g fill="#1f2c44">
        <rect x="-0.2" y="-1.3" width="0.4" height="2.6" rx="0.08"/>
        <rect x="-0.2" y="-1.3" width="0.4" height="2.6" rx="0.08" transform="rotate(45)"/>
        <rect x="-0.2" y="-1.3" width="0.4" height="2.6" rx="0.08" transform="rotate(90)"/>
        <rect x="-0.2" y="-1.3" width="0.4" height="2.6" rx="0.08" transform="rotate(135)"/>
      </g>
      <circle r="0.4" fill="#e9a77b"/>
    </g>
  </defs>
  <rect width="1400" height="350" fill="url(#bg)"/>
  <rect y="290" width="1400" height="60" fill="#46597a"/>
  <rect y="290" width="1400" height="6" fill="#2f3f5c"/>

  <use href="#gear" transform="translate(300 175) scale(70)"/>
  <use href="#gear" transform="translate(432 232) scale(42)"/>
  <use href="#gear" transform="translate(1030 150) scale(58)"/>

  <g fill="#1f2c44">
    <!-- wrench -->
    <g transform="translate(640 175) rotate(-35)">
      <rect x="-150" y="-12" width="300" height="24" rx="12"/>
      <path d="M150 -36 a36 36 0 1 1 0 72 a36 36 0 1 1 0 -72 Z M168 -14 h30 v28 h-30 a18 18 0 0 1 0 -28 Z" fill-rule="evenodd"/>
      <circle cx="-150" cy="0" r="22"/>
      <circle cx="-150" cy="0" r="8" fill="#e9a77b"/>
    </g>
  </g>

  <!-- ruler -->
  <g transform="translate(820 262)">
    <rect width="320" height="34" rx="4" fill="#fff1c9" stroke="#1f2c44" stroke-width="3"/>
    <g stroke="#1f2c44" stroke-width="3" stroke-linecap="round">
      <path d="M20 0v14M60 0v14M100 0v14M140 0v14M180 0v14M220 0v14M260 0v14M300 0v14"/>
      <path d="M40 0v8M80 0v8M120 0v8M160 0v8M200 0v8M240 0v8M280 0v8"/>
    </g>
  </g>
</svg>
